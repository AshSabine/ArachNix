[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "arachnix-viz"
version = "0.1.0"
description = "Convert and render ArachNix JSON to WireViz YAML"
requires-python = ">=3.10"
dependencies = ["pyyaml"]

[project.scripts]
arachnix-viz = "arachnix_viz.cli:main"

[tool.setuptools]
packages = ["arachnix_viz"]
